name: Deploy

on:
  push:
    branches: [prod]

# Required for GitHub's OIDC token used to assume the AWS deploy role —
# no long-lived AWS keys are stored in this repo.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Match the npm version lockfiles are generated with locally — avoids
      # spurious `npm ci` EUSAGE failures from npm-version-specific lockfile
      # interpretation differences.
      - run: npm install -g npm@11

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1. Install api's deps and generate the Prisma client (both binary
      # targets from schema.prisma: native + rhel-openssl-3.0.x for Lambda).
      # cdk deploy's esbuild bundling copies api/node_modules/.prisma
      # straight into the Lambda bundle, so this must happen before it runs.
      #
      # The migrate Lambda's bundling hook (api-stack.ts) separately expects
      # node_modules/@prisma/engines/schema-engine-rhel-openssl-3.0.x to
      # already exist — that's @prisma/engines' own binary cache, which
      # `prisma generate` does NOT populate.
      #
      # `PRISMA_CLI_BINARY_TARGETS=... npm rebuild @prisma/engines` (the
      # previously documented approach) is non-deterministic: @prisma/client,
      # @prisma/engines and prisma's own postinstall scripts all independently
      # trigger the same fetch-engine download logic, guarded by a 20s lock
      # file — whichever one wins the lock decides what actually gets
      # fetched, so a manual rebuild shortly after `npm ci` can silently
      # no-op. api/scripts/fetch-migrate-engine.js calls @prisma/fetch-engine's
      # download() API directly, bypassing that race entirely.
      - name: Install api deps and generate Prisma client
        run: |
          npm ci
          npx prisma generate --schema=api/prisma/schema.prisma
          node api/scripts/fetch-migrate-engine.js

      # 2. blogdobroomn is sunset — the frontend is a single static page (no
      # build step), see infrastructure/lib/stacks/frontend-stack.ts and
      # docs/disaster-recovery.md's "Resurrection runbook". Sync it to S3
      # before the CDK deploy, matching the order in README's documented
      # manual procedure.
      - name: Sync sunset page to S3
        run: |
          aws s3 sync infrastructure/assets/sunset-site \
            s3://${{ vars.FRONTEND_BUCKET }} --delete

      # 3. Deploy every stack. Real Google OAuth creds are always passed
      # (GitHub Secrets) so this never falls into the placeholder-credential
      # path that once overwrote Cognito's real Google IdP secret — see
      # README's "Two footguns" section under Deployment.
      #
      # MigrateFn's bundling hook (api-stack.ts afterBundling) copies the
      # rhel-openssl-3.0.x binary from `inputDir` — the original repo
      # checkout — not from any directory CDK's own nodeModules install
      # writes to, so it just needs the previous step's fetch to have
      # already happened; no special env var is needed here.
      - name: cdk deploy --all
        working-directory: infrastructure
        run: |
          npm ci
          npx cdk deploy --all --require-approval never \
            --context googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
            --context googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --context hostedZoneId=${{ vars.HOSTED_ZONE_ID }}

      # 4. Invalidate CloudFront so viewers see the new content immediately.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # 5. Apply any pending Prisma migrations via the on-demand migration
      # Lambda — the only network path into the private-subnet RDS instance.
      - name: Run pending database migrations
        run: |
          aws lambda invoke \
            --function-name ${{ vars.MIGRATE_FUNCTION_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            /tmp/migrate-output.json
          cat /tmp/migrate-output.json
