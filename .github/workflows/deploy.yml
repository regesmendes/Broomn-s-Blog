name: Deploy

on:
  push:
    branches: [prod]

# Required for GitHub's OIDC token used to assume the AWS deploy role —
# no long-lived AWS keys are stored in this repo.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Match the npm version lockfiles are generated with locally — avoids
      # spurious `npm ci` EUSAGE failures from npm-version-specific lockfile
      # interpretation differences.
      - run: npm install -g npm@11

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1. blogdobroomn is sunset — the frontend is a single static page (no
      # build step), see infrastructure/lib/stacks/frontend-stack.ts and
      # docs/disaster-recovery.md's "Resurrection runbook". Sync it to S3
      # before the CDK deploy, matching the order in README's documented
      # manual procedure.
      - name: Sync sunset page to S3
        run: |
          aws s3 sync infrastructure/assets/sunset-site \
            s3://${{ vars.FRONTEND_BUCKET }} --delete

      # 2. Deploy every stack (Cognito, Storage, Ses, Frontend — DatabaseStack/
      # ApiStack/MediaCdnStack were removed from the app when they were torn
      # down, see infrastructure/bin/infrastructure.ts). Real Google OAuth
      # creds are always passed (GitHub Secrets) so this never falls into the
      # placeholder-credential path that once overwrote Cognito's real Google
      # IdP secret — see README's "Two footguns" section under Deployment.
      - name: cdk deploy --all
        working-directory: infrastructure
        run: |
          npm ci
          npx cdk deploy --all --require-approval never \
            --context googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
            --context googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --context hostedZoneId=${{ vars.HOSTED_ZONE_ID }}

      # 3. Invalidate CloudFront so viewers see the new content immediately.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
